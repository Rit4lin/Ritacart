name: Build and publish container image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rit4lin/ritacart

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: PYTHONPATH=. pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read release version
        id: version
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=RitaCart local-first grocery receipt analytics

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Unraid deployments for this project target standard Intel/AMD hosts.
          # Building ARM under QEMU on hosted runners is disproportionately slow.
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Create a versioned GitHub release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("frontend/package.json"))["version"])')
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub release $TAG already exists; keeping it unchanged."
            exit 0
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "RitaCart ${VERSION}" \
            --notes-file CHANGELOG.md
